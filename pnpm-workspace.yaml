autoInstallPeers: true
# Build scripts each dependency may run. The four below ship prebuilt binaries,
# so their scripts aren't needed (and would need a compiler on Alpine).
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  less: false
  nx: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - react-dom@19.2.8
  - react@19.2.8
  - mongodb@7.6.0
